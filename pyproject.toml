[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anchor-cli"
version = "0.3.0"
description = "Scaffold a project with Anchor doctrine — structured prompting/orchestration for less-powerful models"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

[project.urls]
Homepage = "https://carefreeinv.com/anchor"

[project.scripts]
anchor = "anchor:main"

# scripts/anchor.py is exposed as the top-level "anchor" module without restructuring
# scripts/. Alongside it ships every module `anchor` imports — the scaffolder's own
# helpers and the plan-workflow scripts the `anchor plans|work|review|draft` verbs wrap
# (tests/test_anchor_cli.py checks this list against the real import graph). The rest of the
# fleet tooling (orchestrate.py, router.py, ...) is deliberately left alone here; it is
# designed to be copied standalone into other repos, not imported from an installed
# package. anchor_client is included for `--delegate`, which also needs `requests` and
# `pyyaml` — not declared, so the deterministic verbs install with no dependencies.
[tool.setuptools]
package-dir = { "" = "scripts" }
py-modules = [
    "anchor",
    "anchor_cli",
    "anchor_ops",
    "anchor_client",
    "fit_device",
    "fleet_watch",
    "inference_load",
    "lease_branch",
    "merge_feature",
    "nvidia_build_probe",
    "pending_merges",
    "plan_board",
    "plan_lease",
    "plan_parse",
    "plan_select",
    "plan_store",
    "plan_watch",
    "release_progress",
    "scope_gate",
    "work_once",
    "worktree_for_agent",
    "write_aider_env",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
